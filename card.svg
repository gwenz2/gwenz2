<svg fill="none" viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0f" />
      <stop offset="50%" stop-color="#0c1017" />
      <stop offset="100%" stop-color="#0a0e16" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.5" />
    </linearGradient>

    <!-- Accent Cyan Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glare Sheen Gradient -->
    <linearGradient id="glareGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Matrix Dot Pattern -->
    <pattern id="dotPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.35" />
    </pattern>

    <!-- Card Clip Path -->
    <clipPath id="cardClip">
      <rect x="2" y="2" width="796" height="396" rx="16" />
    </clipPath>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes sweepSheen {
      0% { transform: translateX(-800px) skewX(-20deg); }
      100% { transform: translateX(1200px) skewX(-20deg); }
    }
    @keyframes waveBorder {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.85; }
    }
    @keyframes scanline {
      0% { transform: translateY(-20px); }
      100% { transform: translateY(420px); }
    }

    .pulse-dot {
      transform-origin: 730px 24px;
      animation: pulseGlow 1.8s ease-in-out infinite;
    }
    .cursor-blink {
      animation: blinkCursor 0.9s infinite;
    }
    .glare-sweep {
      animation: sweepSheen 5.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .card-border {
      animation: waveBorder 4s ease-in-out infinite;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>

  <!-- Group with Card Clip -->
  <g clip-path="url(#cardClip)">
    <!-- Base Background -->
    <rect x="0" y="0" width="800" height="400" fill="url(#bgGrad)" />

    <!-- Ambient Dot Grid -->
    <rect x="0" y="0" width="800" height="400" fill="url(#dotPattern)" />

    <!-- Ambient Glow Blobs -->
    <circle cx="120" cy="80" r="140" fill="#38bdf8" opacity="0.04" />
    <circle cx="700" cy="320" r="160" fill="#10b981" opacity="0.04" />

    <!-- Top Window Titlebar -->
    <rect x="0" y="0" width="800" height="48" fill="#0d1118" />
    <line x1="0" y1="48" x2="800" y2="48" stroke="#1e293b" stroke-width="1" />

    <!-- Window Controls (Traffic Lights) -->
    <circle cx="28" cy="24" r="5.5" fill="#ef4444" opacity="0.85" />
    <circle cx="48" cy="24" r="5.5" fill="#f59e0b" opacity="0.85" />
    <circle cx="68" cy="24" r="5.5" fill="#10b981" opacity="0.85" />

    <!-- Title Centered -->
    <text x="400" y="29" text-anchor="middle" fill="#64748b" font-size="12" font-weight="600" class="mono" letter-spacing="0.08em">balajedrion.site // profile.sh</text>

    <!-- ================= TERMINAL WORKSPACE ================= -->
    <g transform="translate(28, 72)">
      <!-- Terminal Panel -->
      <rect x="0" y="0" width="744" height="300" rx="12" fill="#090c12" stroke="#1e293b" stroke-width="1" />

      <!-- Console Sub-Header -->
      <rect x="0" y="0" width="744" height="34" rx="12" fill="#0d1119" />
      <line x1="0" y1="34" x2="744" y2="34" stroke="#1e293b" stroke-width="1" />
      <text x="18" y="22" fill="#64748b" font-size="11" font-weight="600" class="mono">bash - session #01</text>
      <circle cx="720" cy="17" r="3" fill="#38bdf8" opacity="0.6" />

      <!-- Command 1: Identity -->
      <text x="20" y="66" fill="#38bdf8" font-size="12" font-weight="700" class="mono">$ whoami</text>
      <text x="20" y="88" fill="#f8fafc" font-size="12" class="mono">Gwen Balajediong <tspan fill="#64748b">—</tspan> indie tinkerer &amp; student</text>

      <!-- Command 2: Focus Areas -->
      <text x="20" y="122" fill="#38bdf8" font-size="12" font-weight="700" class="mono">$ cat ./focus.json</text>
      <text x="20" y="144" fill="#94a3b8" font-size="11.5" class="mono">{</text>
      <text x="36" y="162" fill="#e2e8f0" font-size="11.5" class="mono">&quot;web&quot;: <tspan fill="#34d399">&quot;PHP, CodeIgniter, MySQL, Node.js&quot;</tspan>,</text>
      <text x="36" y="180" fill="#e2e8f0" font-size="11.5" class="mono">&quot;native&quot;: <tspan fill="#34d399">&quot;C# (Win32), Electron, Android (Kotlin)&quot;</tspan>,</text>
      <text x="36" y="198" fill="#e2e8f0" font-size="11.5" class="mono">&quot;experiments&quot;: <tspan fill="#34d399">&quot;Godot 3D physics, Obsidian MCP&quot;</tspan></text>
      <text x="20" y="216" fill="#94a3b8" font-size="11.5" class="mono">}</text>

      <!-- Command 3: Status / Motto -->
      <text x="20" y="248" fill="#38bdf8" font-size="12" font-weight="700" class="mono">$ echo $MISSION</text>
      <text x="20" y="268" fill="#fbbf24" font-size="11.5" font-weight="600" class="mono">&quot;Build simple. Ship what works. Enjoy the process.&quot;</text>

      <!-- Command 4: Prompt with Blinking Cursor -->
      <text x="20" y="292" fill="#10b981" font-size="12" font-weight="700" class="mono">$ </text>
      <rect x="36" y="280" width="8" height="15" fill="#10b981" class="cursor-blink" />
    </g>

    <!-- Glossy Glare Sheen Sweep (Motion Library: Glossy Glare) -->
    <rect x="0" y="0" width="120" height="400" fill="url(#glareGrad)" class="glare-sweep" pointer-events="none" />
  </g>

  <!-- Outer Animated Border -->
  <rect x="1.5" y="1.5" width="797" height="397" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" class="card-border" pointer-events="none" />
</svg>